<nav class="social-icons" aria-label="Profiles">
  {%- if site.links.scholar %}<a href="{{ site.links.scholar }}" aria-label="Google Scholar" title="Google Scholar">{% include icons/scholar.svg %}</a>{% endif %}
  {%- if site.links.github %}<a href="{{ site.links.github }}" aria-label="GitHub" title="GitHub">{% include icons/github.svg %}</a>{% endif %}
  {%- if site.links.linkedin %}<a href="{{ site.links.linkedin }}" aria-label="LinkedIn" title="LinkedIn">{% include icons/linkedin.svg %}</a>{% endif %}
  {%- if site.cv %}<a href="{{ site.cv | relative_url }}" aria-label="CV" title="CV">{% include icons/cv.svg %}</a>{% endif %}
  <a href="mailto:{{ site.author.email }}" aria-label="Email" title="Email">{% include icons/mail.svg %}</a>
</nav>
