<header class="site-header">
  {%- unless page.url == "/" %}
  <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
  {%- endunless %}
  <div class="header-right">
    <nav>
      {%- for item in site.data.nav %}
      <a href="{{ item.url | relative_url }}"{% if page.url contains item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {%- endfor %}
    </nav>
    <button class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
      {%- include icons/moon.svg -%}
      {%- include icons/sun.svg -%}
    </button>
  </div>
</header>
